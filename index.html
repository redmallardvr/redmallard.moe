<style>
    /* Your existing styles (unchanged) */
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{

    .tagline{font-size:0.95rem;font-weight:300;color:var(--muted);letter-spacing:0.06em;margin-bottom:2.5rem;animation:fadeUp 1s 0.3s cubic-bezier(0.16,1,0.3,1) both}
    .divider{width:100%;display:flex;align-items:center;gap:1rem;margin-bottom:2rem;animation:fadeUp 1s 0.4s cubic-bezier(0.16,1,0.3,1) both}

    .section-label{font-family:'UnifrakturMaguntia',cursive;font-size:1.2rem;color:var(--muted);letter-spacing:0.1em;margin-bottom:0.75rem;align-self:flex-start}

    .link-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(139,0,0,0.12),transparent);opacity:0;transition:opacity 0.2s}
    .link-btn:hover{border-color:var(--red-bright);border-left-color:var(--red-bright);color:#fff;transform:translateX(4px)}
    .link-btn:hover::before{opacity:1}
    .link-icon{width:20px;height:20px;min-width:20px;display:flex;align-items:center;justify-content:center}
    .link-icon svg{width:18px;height:18px;fill:currentColor;opacity:0.8}
    .link-btn:hover .link-icon svg{opacity:1}
    .link-label{flex:1;font-size:0.95rem}
    .link-sub{font-size:0.78rem;color:var(--muted);margin-left:0.4rem}
    .link-arrow{color:var(--red-mid);font-size:0.9rem;transition:transform 0.2s}
    .link-btn:hover .link-arrow{transform:translateX(3px)}
    .nsfw-wrap{width:100%;margin-bottom:2rem;animation:fadeUp 1s 0.6s cubic-bezier(0.16,1,0.3,1) both}
    .nsfw-toggle{width:100%;display:flex;align-items:center;gap:0.9rem;padding:0.8rem 1.1rem;background:var(--surface);border:1px solid rgba(139,0,0,0.2);border-left:3px solid #4a0000;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:0.95rem;cursor:pointer;text-align:left;transition:all 0.2s ease}
    .nsfw-toggle:hover{border-color:var(--red-bright);border-left-color:var(--red-bright);color:var(--text)}
    .badge{background:#4a0000;color:#cc8888;font-size:0.68rem;padding:0.15rem 0.45rem;letter-spacing:0.12em;border:1px solid rgba(139,0,0,0.4);font-family:'DM Sans',sans-serif}
    .caret{margin-left:auto;color:var(--red-mid);transition:transform 0.3s ease;font-style:normal;font-size:0.8rem}
    .nsfw-toggle[aria-expanded="true"] .caret{transform:rotate(180deg)}
    .nsfw-links{display:none;flex-direction:column;gap:0.5rem;margin-top:0.5rem}
    .nsfw-links.open{display:flex}
    .nsfw-links .link-btn{border-left-color:#7a0000;opacity:0;animation:fadeUp 0.4s ease forwards}
    .nsfw-links .link-btn:nth-child(1){animation-delay:0.05s}
    .nsfw-links .link-btn:nth-child(2){animation-delay:0.1s}
    .nsfw-links .link-btn:nth-child(3){animation-delay:0.15s}

    .footer{margin-top:1rem;font-size:0.78rem;color:#4a3030;letter-spacing:0.04em;animation:fadeUp 1s 0.8s cubic-bezier(0.16,1,0.3,1) both}
    @keyframes dropIn{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:480px){.link-btn,.nsfw-toggle{font-size:0.9rem;padding:0.75rem 1rem}}
